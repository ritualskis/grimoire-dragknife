[package]
name = "grimoire-dragknife-app"
version = "0.1.0"
description = "Grimoire DragKnife Desktop App"
authors = ["Ritual Skis"]
edition = "2021"

[lib]
name = "grimoire_dragknife_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grimoire-dragknife = { path = "../crates/grimoire-dragknife" }
